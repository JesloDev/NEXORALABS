<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eae2cb">
  <title>Offline — NEXORALABS</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; text-align:center;
      padding:24px; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#eae2cb; color:#10241c; }
    @media (prefers-color-scheme: dark) { body { background:#09120f; color:#e7efe9; } }
    img { width:72px; height:72px; border-radius:22%; }
    h1 { font-size:1.25rem; margin:16px 0 8px; }
    p { margin:0 0 20px; opacity:.75; max-width:20rem; line-height:1.5; }
    button { font:inherit; font-weight:600; padding:12px 22px; border:0; border-radius:999px; background:#a1cc2c; color:#09120f; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="NEXORALABS">
    <h1>You're offline</h1>
    <p>NEXORALABS needs an internet connection to load your workspace. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
